name: Build installable Gboard Fusion APK

on:
  workflow_dispatch:
  push:
    branches: [feature/pixelboard-fusion]
    paths:
      - '.github/workflows/build-fusion-apk.yml'

permissions:
  contents: read
  packages: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_ORIGINAL_SHA256: 3099262121a201dcb2ae7e185bee6b2057287a5aeffae4be0e30f537e505e5b3
      BASE_URL: https://d.apkpure.net/b/APK/com.google.android.inputmethod.latin?nc=arm64-v8a&sv=26&versionCode=175940518
      PATCHER_URL: https://raw.githubusercontent.com/Zhanfg/PixelBoard/0cd0900ff6633922801c5a7dab7d985dbfe1a25d/tools/patcher.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Build fusion patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :patches:buildAndroid

      - name: Download and verify original 18.0.3 Gboard APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input tools output
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 360 \
            --user-agent 'Mozilla/5.0' "$BASE_URL" -o input/gboard.apk
          test "$(stat -c%s input/gboard.apk)" -gt 60000000
          echo "$EXPECTED_ORIGINAL_SHA256  input/gboard.apk" | sha256sum -c -
          unzip -tq input/gboard.apk >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging input/gboard.apk | grep -F "name='com.google.android.inputmethod.latin'"
          "$AAPT" dump badging input/gboard.apk | grep -F "versionCode='175940518'"
          "$AAPT" dump badging input/gboard.apk | grep -F "18.0.3.954559732-release-arm64-v8a"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs input/gboard.apk > output/original-signature.txt
          grep -Fqi 'f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83' output/original-signature.txt

      - name: Fetch Morphe patcher and generate a temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 "$PATCHER_URL" -o tools/patcher.jar
          test "$(stat -c%s tools/patcher.jar)" -gt 30000000
          unzip -tq tools/patcher.jar >/dev/null
          mkdir -p tools/signing
          PASS="$(openssl rand -hex 20)"
          echo "::add-mask::$PASS"
          printf '%s' "$PASS" > tools/signing/password.txt
          keytool -genkeypair -keystore tools/signing/fusion.keystore \
            -alias fusion -keyalg RSA -keysize 3072 -validity 3650 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Gboard Fusion Test, O=Axymorrsen" >/dev/null 2>&1

      - name: Apply all merged Morphe patches to stock Gboard
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(cat tools/signing/password.txt)"
          BUNDLE="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n1)"
          test -n "$BUNDLE"
          mkdir -p output tools/patcher-data/tmp
          java -Xmx6g -jar tools/patcher.jar patch \
            --patches="$BUNDLE" \
            --options-file=tools/fusion-options.json \
            --striplibs=arm64-v8a \
            --signer="GboardFusion" \
            --keystore="tools/signing/fusion.keystore" \
            --keystore-password="$PASS" \
            --keystore-entry-alias=fusion \
            --keystore-entry-password="$PASS" \
            --temporary-files-path=tools/patcher-data/tmp \
            -o=output/GboardFusion-18.0.3-arm64-v8a.apk \
            -r=output/patching-result.json \
            input/gboard.apk
          test -s output/GboardFusion-18.0.3-arm64-v8a.apk

      - name: Verify APK, package rename and patching result
        shell: bash
        run: |
          set -euo pipefail
          APK=output/GboardFusion-18.0.3-arm64-v8a.apk
          unzip -tq "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" > output/fusion-badging.txt
          head -n2 output/fusion-badging.txt
          grep -F 'dev.jason.com.google.android.inputmethod.latin' output/fusion-badging.txt
          python3 - <<'PY'
          import json
          with open("output/patching-result.json",encoding="utf-8") as f:
              report=json.load(f)
          print("Patch report summary:",str(report)[:2500])
          with open("output/BUILD_STATUS.txt","w",encoding="utf-8") as out:
              out.write("Gboard Fusion first device-test APK: 18.0.3 arm64-v8a\n")
              out.write("Built from reviewed 18.0.3 stock APK SHA256 309926...505e5b3\n")
              out.write("The patcher completed and the APK signature and package ID were checked.\n")
              out.write("Not a guarantee that every feature works on Android 17.\n")
          PY
          sha256sum "$APK" | tee output/fusion-apk.sha256

      - name: Upload installable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardFusion-APK-18.0.3-arm64-v8a
          path: |
            output/GboardFusion-18.0.3-arm64-v8a.apk
            output/patching-result.json
            output/fusion-apk.sha256
            output/BUILD_STATUS.txt
          retention-days: 30
          if-no-files-found: error
