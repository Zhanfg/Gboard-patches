name: PixelBoard Fusion CI

on:
  workflow_dispatch:
  push:
    branches: [feature/pixelboard-fusion]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Build and test unified patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test :patches:buildAndroid
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gboard-fusion-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
